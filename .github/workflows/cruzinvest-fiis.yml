# CruzInvest: atualiza cruzinvest/dados/ com dados públicos de mercado:
#   fiis.json   - FIIs (CVM): valor patrimonial e rendimento por cota dos últimos 13 meses
#   acoes.json  - ações (CVM, DFP/ITR): números contábeis para P/L, ROE, dívida etc.
#   max52.json  - todos os ativos da B3: máxima e mínima de 52 semanas (Yahoo Finance)
# Roda todo dia; só faz commit quando algum arquivo muda. Não usa nenhum dado pessoal.
name: CruzInvest - dados da CVM (FIIs e ações)

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cruzinvest-fiis
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar fiis.json a partir da CVM
        run: python3 cruzinvest/scripts/fiis_cvm.py cruzinvest/dados/fiis.json

      - name: Gerar acoes.json a partir da CVM (DFP/ITR)
        run: python3 cruzinvest/scripts/acoes_cvm.py cruzinvest/dados/acoes.json

      - name: Gerar max52.json (máxima e mínima de 52 semanas)
        continue-on-error: true   # se o Yahoo falhar, os outros dados ainda são publicados
        run: python3 cruzinvest/scripts/maximas_52s.py cruzinvest/dados/max52.json

      - name: Publicar se mudou
        run: |
          if git diff --quiet -- cruzinvest/dados/; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "cruzinvest-dados[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cruzinvest/dados/fiis.json cruzinvest/dados/acoes.json cruzinvest/dados/max52.json
          git commit -m "CruzInvest: atualiza dados de mercado (CVM e máximas de 52 semanas)"
          git push
